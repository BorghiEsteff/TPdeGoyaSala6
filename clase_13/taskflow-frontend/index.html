<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 16px;
      color: #333;
    }
    h1 { color: #1976d2; margin-bottom: 24px; }
    input, select, button {
      padding: 8px 12px;
      margin: 4px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    button {
      background-color: #1976d2;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 500;
    }
    button:hover { background-color: #1565c0; }
    button.secondary {
      background-color: #f5f5f5;
      color: #333;
      border: 1px solid #ccc;
    }
    button.secondary:hover { background-color: #e0e0e0; }
    #tasks { list-style: none; padding: 0; }
    #tasks li {
      padding: 10px 14px;
      margin: 8px 0;
      background: #fafafa;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      text-transform: capitalize;
    }
    .badge.pendiente { background-color: #fff3e0; color: #e65100; }
    .badge.en_progreso { background-color: #e3f2fd; color: #1565c0; }
    .badge.completada { background-color: #e8f5e9; color: #2e7d32; }
    .error { color: #d32f2f; font-weight: 500; margin-top: 6px; }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .form-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .live-indicator {
      font-size: 13px;
      color: #666;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      background-color: #bbb;
    }
    .dot.active { background-color: #4caf50; }
  </style>
</head>
<body>
  <h1>TaskFlow</h1>

  <section id="login-box">
    <h2>Ingresar</h2>
    <div>
      <input id="username" placeholder="Usuario" autocomplete="username">
    </div>
    <div>
      <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password">
    </div>
    <button onclick="login()">Ingresar</button>
    <p id="login-error" class="error"></p>
  </section>

  <section id="app-box" style="display:none;">
    <div class="header-bar">
      <h2>Mis tareas</h2>
      <div>
        <span id="user-display" style="margin-right: 12px; font-weight: 500;"></span>
        <button class="secondary" onclick="logout()">Salir</button>
      </div>
    </div>

    <ul id="tasks"></ul>

    <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid #eee;">
      <h3>Agregar tarea</h3>
      <div class="form-row">
        <select id="project" onchange="cambiarProyecto()"></select>
        <input id="new-title" placeholder="Título de la nueva tarea" style="flex: 1; min-width: 200px;">
        <button onclick="createTask()">Agregar</button>
      </div>
      <p id="app-error" class="error"></p>
    </div>

    <div class="live-indicator">
      <span id="ws-dot" class="dot"></span>
      <span id="ws-status">Tiempo real desconectado</span>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
